<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Системные требования</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #090b10;
            color: #9ba1a6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-wrapper {
            position: relative;
            max-width: 680px;
            width: 100%;
            border-radius: 18px;
            padding: 1.5px;
            background: linear-gradient(
                180deg, 
                rgba(255, 255, 255, 0.08) 0%, 
                rgba(255, 255, 255, 0.04) 55%, 
                #ff5500 85%, 
                #3b82f6 100%
            );
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 4px 25px rgba(255, 85, 0, 0.12);
        }

        .card {
            background-color: #10141d;
            border-radius: 16.5px;
            padding: 36px 40px;
        }

        h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: #6e7681;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        td {
            padding: 16px 0;
            font-size: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        tr:last-child td {
            border-bottom: none;
            padding-bottom: 0;
        }

        .comp-name {
            color: #c9d1d9;
            font-weight: 500;
        }

        .spec-min {
            color: #8b949e;
        }

        .spec-max {
            color: #ffffff;
            font-weight: 600;
        }

        @media (max-width: 520px) {
            .card {
                padding: 24px 20px;
            }
            th, td {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="card-wrapper">
    <div class="card">
        <h1>Системные требования</h1>
        <p class="subtitle">Оптимизированная конфигурация железа для стабильной работы и мгновенного отклика системы.</p>
        
        <table>
            <thead>
                <tr>
                    <th>Компонент</th>
                    <th>Минимальные</th>
                    <th>Максимальные</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="comp-name">Процессор</td>
                    <td class="spec-min">Intel Core i3</td>
                    <td class="spec-max">Intel i4</td>
                </tr>
                <tr>
                    <td class="comp-name">Видеокарта</td>
                    <td class="spec-min">GTX 960 Super</td>
                    <td class="spec-max">RTX 2060</td>
                </tr>
                <tr>
                    <td class="comp-name">Оперативная память</td>
                    <td class="spec-min">DDR2 8 GB</td>
                    <td class="spec-max">DDR5 16 GB</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
