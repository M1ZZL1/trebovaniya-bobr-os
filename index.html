<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Системные требования</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #090b10;
            color: #9ba1a6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Верхняя черная плашка с иконкой */
        .top-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #000000;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            padding: 8px 18px 8px 12px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .top-badge svg {
            width: 20px;
            height: 20px;
            fill: #9ba1a6;
            flex-shrink: 0;
        }

        /* Основная карточка */
        .card-wrapper {
            position: relative;
            max-width: 680px;
            width: 100%;
            border-radius: 18px;
            padding: 1.5px;
            background: linear-gradient(
                180deg, 
                rgba(255, 255, 255, 0.08) 0%, 
                rgba(255, 255, 255, 0.04) 55%, 
                #ff5500 85%, 
                #3b82f6 100%
            );
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 4px 25px rgba(255, 85, 0, 0.12);
        }

        .card {
            background-color: #10141d;
            border-radius: 16.5px;
            padding: 36px 40px;
        }

        .hero-image {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: block;
        }

        h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: #6e7681;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        td {
            padding: 16px 0;
            font-size: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        tr:last-child td {
            border-bottom: none;
            padding-bottom: 0;
        }

        .comp-name {
            color: #c9d1d9;
            font-weight: 500;
        }

        .spec-min {
            color: #8b949e;
        }

        .spec-max {
            color: #ffffff;
            font-weight: 600;
        }

        @media (max-width: 520px) {
            .card {
                padding: 24px 20px;
            }
            th, td {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<!-- Черная плашка сверху -->
<div class="top-badge">
    <svg viewBox="0 0 24 24" xmlns="http://w3.org">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
    </svg>
    <span>Системные требования</span>
</div>

<!-- Основная карточка -->
<div class="card-wrapper">
    <div class="card">
        <!-- Положи файл batman.png в ту же папку, что и index.html -->
        <img src="batman.png" alt="Персонаж" class="hero-image">

        <h1>Системные требования</h1>
        <p class="subtitle">Оптимизированная конфигурация железа для стабильной работы и мгновенного отклика системы.</p>
        
        <table>
            <thead>
                <tr>
                    <th>Компонент</th>
                    <th>Минимальные</th>
                    <th>Максимальные</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="comp-name">Процессор</td>
                    <td class="spec-min">Intel Core i3</td>
                    <td class="spec-max">Intel i4</td>
                </tr>
                <tr>
                    <td class="comp-name">Видеокарта</td>
                    <td class="spec-min">GTX 960 Super</td>
                    <td class="spec-max">RTX 2060</td>
                </tr>
                <tr>
                    <td class="comp-name">Оперативная память</td>
                    <td class="spec-min">DDR2 8 GB</td>
                    <td class="spec-max">DDR5 16 GB</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
